<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识改变力量，力量重塑人生</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #070709;
  --bg-card: #111115;
  --bg-card-hover: #18181E;
  --bg-elevated: #1A1A22;
  --accent: #C8A45E;
  --accent-dim: #8A7040;
  --accent-glow: rgba(200,164,94,0.15);
  --text-primary: #E8E6E3;
  --text-secondary: #9A9898;
  --text-muted: #6B6969;
  --border: #1E1E24;
  --border-light: #2A2A32;
  --tier1-bg: rgba(200,164,94,0.04);
  --tier1-border: rgba(200,164,94,0.2);
  --grade-high: #4CAF50;
  --grade-mod: #FF9800;
  --grade-low: #F44336;
  --grade-vlow: #9C27B0;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

/* ===== HERO ===== */
.hero {
  position: relative;
  padding: 80px 24px 60px;
  text-align: center;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 100%;
  background: radial-gradient(ellipse at 50% 0%, rgba(200,164,94,0.06) 0%, transparent 70%);
  pointer-events: none;
}
.hero-badge {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--accent);
  border: 1px solid var(--accent-dim);
  padding: 6px 18px;
  margin-bottom: 32px;
  font-weight: 500;
}
.hero h1 {
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(28px, 5vw, 48px);
  font-weight: 900;
  line-height: 1.3;
  margin-bottom: 20px;
  background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.hero-sub {
  font-size: 15px;
  color: var(--text-secondary);
  max-width: 600px;
  margin: 0 auto 40px;
  line-height: 1.8;
}
.hero-stats {
  display: flex;
  justify-content: center;
  gap: 48px;
  margin-bottom: 48px;
}
.hero-stat {
  text-align: center;
}
.hero-stat-num {
  font-family: 'Noto Serif SC', serif;
  font-size: 36px;
  font-weight: 700;
  color: var(--accent);
}
.hero-stat-label {
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: 1px;
  margin-top: 4px;
}

/* ===== SEARCH ===== */
.search-section {
  max-width: 800px;
  margin: 0 auto;
  padding: 0 24px;
  position: relative;
}
.search-box {
  position: relative;
}
.search-box input {
  width: 100%;
  padding: 18px 24px 18px 52px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-light);
  border-radius: 12px;
  color: var(--text-primary);
  font-size: 16px;
  font-family: 'Noto Sans SC', sans-serif;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-box input:focus {
  border-color: var(--accent-dim);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.search-box input::placeholder {
  color: var(--text-muted);
}
.search-icon {
  position: absolute;
  left: 20px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 18px;
}

/* ===== FILTERS ===== */
.filters-section {
  max-width: 1400px;
  margin: 40px auto 0;
  padding: 0 24px;
}
.filters-label {
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.filters-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.filter-btn {
  padding: 8px 16px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--text-secondary);
  font-size: 13px;
  font-family: 'Noto Sans SC', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.filter-btn:hover {
  border-color: var(--accent-dim);
  color: var(--text-primary);
}
.filter-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #000;
  font-weight: 500;
}
.filter-btn .count {
  font-size: 11px;
  opacity: 0.7;
  margin-left: 4px;
}

/* Tier toggle */
.tier-toggle {
  display: flex;
  gap: 8px;
  margin-top: 20px;
}
.tier-btn {
  padding: 8px 20px;
  background: transparent;
  border: 1px solid var(--border-light);
  border-radius: 8px;
  color: var(--text-secondary);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Noto Sans SC', sans-serif;
}
.tier-btn.active {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-glow);
}

/* ===== RESULTS ===== */
.results-section {
  max-width: 1400px;
  margin: 32px auto;
  padding: 0 24px;
}
.results-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.results-count {
  font-size: 14px;
  color: var(--text-muted);
}
.results-count span {
  color: var(--accent);
  font-weight: 700;
}

/* Cards grid */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 16px;
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  cursor: pointer;
  transition: all 0.25s;
  position: relative;
  overflow: hidden;
}
.card:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-light);
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}
.card.tier1 {
  background: var(--tier1-bg);
  border-color: var(--tier1-border);
}
.card.tier1:hover {
  border-color: var(--accent-dim);
  box-shadow: 0 8px 32px rgba(200,164,94,0.08);
}
.card.tier1::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 3px;
  height: 100%;
  background: var(--accent);
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 12px;
}
.card-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 15px;
  font-weight: 700;
  line-height: 1.5;
  color: var(--text-primary);
  flex: 1;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-tier-badge {
  font-size: 10px;
  letter-spacing: 1px;
  padding: 3px 8px;
  border-radius: 4px;
  white-space: nowrap;
  font-weight: 700;
  flex-shrink: 0;
}
.card-tier-badge.t1 {
  background: var(--accent);
  color: #000;
}
.card-tier-badge.t2 {
  background: var(--border-light);
  color: var(--text-secondary);
}

.card-conclusion {
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.7;
  margin-bottom: 16px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.card-meta-item {
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 4px;
}
.card-meta-item.grade {
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 500;
}
.grade-high { background: rgba(76,175,80,0.15); color: var(--grade-high); }
.grade-mod { background: rgba(255,152,0,0.15); color: var(--grade-mod); }
.grade-low { background: rgba(244,67,54,0.15); color: var(--grade-low); }
.grade-vlow { background: rgba(156,39,176,0.15); color: var(--grade-vlow); }
.grade-unknown { background: var(--border); color: var(--text-muted); }

.card-category {
  font-size: 11px;
  color: var(--accent);
  background: var(--accent-glow);
  padding: 2px 8px;
  border-radius: 4px;
}

.card-expand-icon {
  position: absolute;
  bottom: 12px;
  right: 16px;
  font-size: 12px;
  color: var(--text-muted);
  transition: transform 0.2s;
}

/* ===== MODAL ===== */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(8px);
  z-index: 1000;
  overflow-y: auto;
  padding: 40px 24px;
}
.modal-overlay.active {
  display: flex;
  justify-content: center;
  align-items: flex-start;
}
.modal-content {
  background: var(--bg-elevated);
  border: 1px solid var(--border-light);
  border-radius: 16px;
  max-width: 800px;
  width: 100%;
  padding: 40px;
  position: relative;
  animation: modalIn 0.3s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.modal-close {
  position: absolute;
  top: 20px; right: 24px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 24px;
  cursor: pointer;
  transition: color 0.2s;
  width: 36px; height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
}
.modal-close:hover {
  color: var(--text-primary);
  background: var(--border);
}

.modal-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 22px;
  font-weight: 700;
  line-height: 1.5;
  margin-bottom: 8px;
  padding-right: 40px;
}
.modal-title-en {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 24px;
  line-height: 1.6;
  font-style: italic;
}
.modal-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 28px;
}
.modal-badge {
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 6px;
  font-weight: 500;
}

.modal-section {
  margin-bottom: 28px;
}
.modal-section-title {
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 10px;
  font-weight: 700;
}
.modal-section-content {
  font-size: 15px;
  color: var(--text-secondary);
  line-height: 1.8;
}
.modal-section-content p {
  margin-bottom: 8px;
}
.modal-data-table {
  width: 100%;
  border-collapse: collapse;
  margin: 8px 0;
  font-size: 13px;
}
.modal-data-table th,
.modal-data-table td {
  padding: 10px 12px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}
.modal-data-table th {
  color: var(--text-muted);
  font-weight: 500;
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.modal-data-table td {
  color: var(--text-secondary);
}
.modal-doi {
  font-size: 13px;
  color: var(--accent-dim);
  word-break: break-all;
}
.modal-doi a {
  color: var(--accent);
  text-decoration: none;
}
.modal-doi a:hover {
  text-decoration: underline;
}

/* ===== FOOTER ===== */
.footer {
  text-align: center;
  padding: 60px 24px 40px;
  border-top: 1px solid var(--border);
  margin-top: 60px;
}
.footer-text {
  font-size: 12px;
  color: var(--text-muted);
  line-height: 2;
}
.footer-brand {
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  color: var(--accent-dim);
  margin-bottom: 8px;
}

/* ===== NO RESULTS ===== */
.no-results {
  text-align: center;
  padding: 80px 24px;
  color: var(--text-muted);
}
.no-results-icon {
  font-size: 48px;
  margin-bottom: 16px;
  opacity: 0.5;
}
.no-results-text {
  font-size: 16px;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .hero { padding: 60px 16px 40px; }
  .hero h1 { font-size: 24px; }
  .hero-stats { gap: 24px; }
  .hero-stat-num { font-size: 28px; }
  .cards-grid { grid-template-columns: 1fr; }
  .modal-content { padding: 24px; }
  .modal-title { font-size: 18px; }
  .filters-row { gap: 6px; }
  .filter-btn { padding: 6px 12px; font-size: 12px; }
}

/* ===== SCROLL ===== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent-dim); }

/* highlight */
mark {
  background: var(--accent-glow);
  color: var(--accent);
  padding: 0 2px;
  border-radius: 2px;
}
</style>
</head>

// ===== STATE =====
let currentTier = 'all';
let currentCategory = 'all';
let searchQuery = '';

// ===== INIT =====
function init() {
  buildCategoryFilters();
  updateStats();
  renderCards();
  bindEvents();
}

function updateStats() {
  const categories = new Set(LITERATURE_DATA.map(d => d.category).filter(Boolean));
  document.getElementById('stat-total').textContent = LITERATURE_DATA.length;
  document.getElementById('stat-t1').textContent = LITERATURE_DATA.filter(d => d.tier === 1).length;
  document.getElementById('stat-categories').textContent = categories.size;
}

function buildCategoryFilters() {
  const counts = {};
  LITERATURE_DATA.forEach(d => {
    const cat = d.category || '其他';
    counts[cat] = (counts[cat] || 0) + 1;
  });

  // Sort by count desc, take top ones
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const container = document.getElementById('category-filters');

  let html = `<button class="filter-btn active" data-category="all">全部<span class="count"> ${LITERATURE_DATA.length}</span></button>`;

  // Consolidate small categories
  const majorCats = [];
  const minorCats = [];
  sorted.forEach(([cat, count]) => {
    if (count >= 3) majorCats.push([cat, count]);
    else minorCats.push([cat, count]);
  });

  majorCats.forEach(([cat, count]) => {
    html += `<button class="filter-btn" data-category="${cat}">${cat}<span class="count"> ${count}</span></button>`;
  });

  if (minorCats.length > 0) {
    const minorTotal = minorCats.reduce((s, [, c]) => s + c, 0);
    html += `<button class="filter-btn" data-category="__other__">其他<span class="count"> ${minorTotal}</span></button>`;
  }

  container.innerHTML = html;
}

function getFilteredData() {
  return LITERATURE_DATA.filter(d => {
    // Tier filter
    if (currentTier !== 'all' && String(d.tier) !== currentTier) return false;

    // Category filter
    if (currentCategory !== 'all') {
      const cat = d.category || '其他';
      if (currentCategory === '__other__') {
        // "Other" = categories with <3 entries
        const counts = {};
        LITERATURE_DATA.forEach(item => {
          const c = item.category || '其他';
          counts[c] = (counts[c] || 0) + 1;
        });
        if (counts[cat] >= 3) return false;
      } else {
        if (cat !== currentCategory) return false;
      }
    }

    // Search filter
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      const searchable = [
        d.title_en, d.title_cn, d.authors, d.journal,
        d.conclusion, d.mechanism, d.implication, d.key_data,
        d.question, d.category, d.id, d.type, d.sample
      ].filter(Boolean).join(' ').toLowerCase();
      if (!searchable.includes(q)) return false;
    }

    return true;
  });
}

function getGradeClass(grade) {
  if (!grade) return 'grade-unknown';
  if (grade.includes('高') || grade.includes('High')) return 'grade-high';
  if (grade.includes('中') || grade.includes('Mod')) return 'grade-mod';
  if (grade.includes('低') && !grade.includes('极低')) return 'grade-low';
  if (grade.includes('极低') || grade.includes('Very')) return 'grade-vlow';
  return 'grade-unknown';
}

function highlightText(text, query) {
  if (!text || !query) return text || '';
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const regex = new RegExp(`(${escaped})`, 'gi');
  return text.replace(regex, '<mark>$1</mark>');
}

function renderCards() {
  const data = getFilteredData();
  const grid = document.getElementById('cards-grid');
  const noResults = document.getElementById('no-results');
  const showing = document.getElementById('results-showing');

  showing.textContent = data.length;

  if (data.length === 0) {
    grid.style.display = 'none';
    noResults.style.display = 'block';
    return;
  }

  grid.style.display = 'grid';
  noResults.style.display = 'none';

  // Sort: Tier 1 first, then by date desc
  data.sort((a, b) => {
    if (a.tier !== b.tier) return b.tier - a.tier;
    return (b.date || '').localeCompare(a.date || '');
  });

  const html = data.map(d => {
    const title = d.title_cn || d.title_en || d.id;
    const conclusion = d.conclusion || '暂无结论';
    const grade = d.grade || '';
    const gradeClass = getGradeClass(grade);
    const category = d.category || '其他';
    const authors = d.authors || '';
    const year = d.year || '';
    const tierClass = d.tier === 1 ? 'tier1' : '';
    const tierBadgeClass = d.tier === 1 ? 't1' : 't2';
    const tierLabel = d.tier === 1 ? '深度解读' : '元数据卡';

    const hTitle = highlightText(title, searchQuery);
    const hConclusion = highlightText(conclusion, searchQuery);

    return `
      <div class="card ${tierClass}" onclick="openModal('${d.id}')">
        <div class="card-header">
          <div class="card-title">${hTitle}</div>
          <span class="card-tier-badge ${tierBadgeClass}">${tierLabel}</span>
        </div>
        <div class="card-conclusion">${hConclusion}</div>
        <div class="card-meta">
          ${grade ? `<span class="card-meta-item grade ${gradeClass}">${grade}</span>` : ''}
          ${category ? `<span class="card-category">${category}</span>` : ''}
          ${authors ? `<span class="card-meta-item">${authors}${year ? ' ' + year : ''}</span>` : ''}
        </div>
      </div>
    `;
  }).join('');

  grid.innerHTML = html;
}

function openModal(id) {
  const d = LITERATURE_DATA.find(item => item.id === id);
  if (!d) return;

  const title = d.title_cn || d.title_en || d.id;
  const titleEn = d.title_en && d.title_cn ? d.title_en : '';
  const grade = d.grade || '';
  const gradeClass = getGradeClass(grade);
  const category = d.category || '其他';
  const doiLink = d.doi ? `https://doi.org/${d.doi}` : '';

  let html = `
    <div class="modal-title">${title}</div>
    ${titleEn ? `<div class="modal-title-en">${titleEn}</div>` : ''}
    <div class="modal-badges">
      <span class="modal-badge ${d.tier === 1 ? 'grade-high' : 'grade-unknown'}">${d.tier === 1 ? '深度解读' : '元数据卡'}</span>
      ${grade ? `<span class="modal-badge ${gradeClass}">${grade}</span>` : ''}
      ${category ? `<span class="modal-badge" style="background:var(--accent-glow);color:var(--accent)">${category}</span>` : ''}
      ${d.year ? `<span class="modal-badge" style="background:var(--border);color:var(--text-secondary)">${d.year}</span>` : ''}
      ${d.type ? `<span class="modal-badge" style="background:var(--border);color:var(--text-secondary)">${d.type}</span>` : ''}
    </div>
  `;

  // Meta info table
  html += `<div class="modal-section">
    <div class="modal-section-title">基本信息</div>
    <table class="modal-data-table">
      <tr>${d.authors ? `<th>作者</th><td>${d.authors}</td>` : '<th>作者</th><td>未报告</td>'}</tr>
      ${d.journal ? `<tr><th>期刊</th><td>${d.journal}</td></tr>` : ''}
      ${d.sample ? `<tr><th>样本</th><td>${d.sample}</td></tr>` : ''}
      ${d.date ? `<tr><th>收录日期</th><td>${d.date}</td></tr>` : ''}
      ${d.doi ? `<tr><th>DOI</th><td class="modal-doi"><a href="${doiLink}" target="_blank">${d.doi}</a></td></tr>` : ''}
      ${d.pmid ? `<tr><th>PMID</th><td>${d.pmid}</td></tr>` : ''}
    </table>
  </div>`;

  // Conclusion
  if (d.conclusion) {
    html += `<div class="modal-section">
      <div class="modal-section-title">核心结论</div>
      <div class="modal-section-content"><p>${d.conclusion}</p></div>
    </div>`;
  }

  // Question
  if (d.question) {
    html += `<div class="modal-section">
      <div class="modal-section-title">研究问题</div>
      <div class="modal-section-content"><p>${d.question}</p></div>
    </div>`;
  }

  // Mechanism
  if (d.mechanism) {
    html += `<div class="modal-section">
      <div class="modal-section-title">生理机制</div>
      <div class="modal-section-content"><p>${d.mechanism}</p></div>
    </div>`;
  }

  // Key data
  if (d.key_data) {
    html += `<div class="modal-section">
      <div class="modal-section-title">关键数据</div>
      <div class="modal-section-content"><p>${d.key_data}</p></div>
    </div>`;
  }

  // Implication
  if (d.implication) {
    html += `<div class="modal-section">
      <div class="modal-section-title">实践启示</div>
      <div class="modal-section-content"><p>${d.implication}</p></div>
    </div>`;
  }

  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
  document.body.style.overflow = '';
}

function bindEvents() {
  // Search
  let searchTimer;
  document.getElementById('search-input').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      searchQuery = e.target.value.trim();
      renderCards();
    }, 200);
  });

  // Tier toggle
  document.querySelectorAll('.tier-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tier-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTier = btn.dataset.tier;
      renderCards();
    });
  });

  // Category filters
  document.getElementById('category-filters').addEventListener('click', (e) => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCategory = btn.dataset.category;
    renderCards();
  });

  // Modal close
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal').addEventListener('click', (e) => {
    if (e.target === document.getElementById('modal')) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });
}

// Start
init();
</script>
</body>
</html>
